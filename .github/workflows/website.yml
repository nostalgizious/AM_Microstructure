name: Check research website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: python tools/build_site.py
      - run: python tools/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: research-website
          path: website/dist/
          if-no-files-found: error
