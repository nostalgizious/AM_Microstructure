<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
<title id="title">FEM temperatures drive the cellular automaton</title><desc id="desc">A transient FEM solve produces nodal temperatures, which can be saved and replayed. Spatial and temporal interpolation maps them onto the cellular automaton, producing grain fields.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#355943"/></marker></defs>
<rect width="960" height="230" fill="#f5f3eb"/>
<g font-family="sans-serif" fill="#183b2a"><g fill="#e5eadc" stroke="#b3c2ad"><rect x="20" y="45" width="190" height="120" rx="4"/><rect x="260" y="45" width="190" height="120" rx="4"/><rect x="500" y="45" width="190" height="120" rx="4"/><rect x="740" y="45" width="200" height="120" rx="4"/></g>
<g font-size="17" text-anchor="middle"><text x="115" y="80">Transient FEM</text><text x="355" y="80">Saved thermal data</text><text x="595" y="80">Map to CA cells</text><text x="840" y="80">Grow the grains</text></g>
<g font-size="13" text-anchor="middle" fill="#506652"><text x="115" y="110">Mesh + heat input</text><text x="115" y="134">Nodal T (K), time (s)</text><text x="355" y="110">Raw output + initial state</text><text x="355" y="134">Replay without the solver</text><text x="595" y="110">Spatial + time interpolation</text><text x="595" y="134">Cell T (K), step (ms)</text><text x="840" y="110">Nucleation + capture</text><text x="840" y="134">IDs, orientations, VTK</text></g>
<g stroke="#355943" stroke-width="2" marker-end="url(#arrow)"><path d="M215 105H250"/><path d="M455 105H490"/><path d="M695 105H730"/></g><text x="480" y="205" font-size="13" text-anchor="middle">One-way thermal coupling · the same Julia evolution path handles fresh output and saved replay</text></g></svg>
